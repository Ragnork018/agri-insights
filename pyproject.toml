[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-insights"
version = "1.1.0"
description = "Leakage-aware agricultural modelling and crop-yield research workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3"
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "matplotlib>=3.8"]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
agri-train = "agri_insights.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
