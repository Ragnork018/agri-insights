[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="agri-insights"
version="1.0.0"
requires-python=">=3.11"
dependencies=["pandas>=2.1","scikit-learn>=1.4","numpy>=1.26","joblib>=1.3"]
[project.optional-dependencies]
dashboard=["streamlit>=1.32","matplotlib>=3.8"]
xgboost=["xgboost>=2.0"]
dev=["pytest>=8"]
[tool.setuptootls.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
